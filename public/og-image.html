<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangoRemote - OG Image</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            width: 1200px;
            height: 630px;
            font-family: 'Outfit', -apple-system, sans-serif;
            background: linear-gradient(135deg, #FFFFFF 0%, #F9FAFB 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .accent-bar {
            position: absolute;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #F26419 0%, #14532d 100%);
            top: 0;
        }
        .container {
            text-align: center;
            z-index: 2;
            padding: 60px;
        }
        .mango {
            font-size: 120px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 12px rgba(242, 100, 25, 0.2));
        }
        h1 {
            font-size: 72px;
            font-weight: 800;
            color: #111318;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }
        .tagline {
            font-size: 32px;
            color: #F26419;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .subtitle {
            font-size: 24px;
            color: #3D4451;
            font-weight: 400;
            max-width: 900px;
            line-height: 1.4;
        }
        .badge {
            display: inline-block;
            background: #14532d;
            color: #fff;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 600;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="accent-bar"></div>
    <div class="container">
        <div class="mango">🥭</div>
        <h1>MangoRemote</h1>
        <div class="tagline">Remote Jobs for Living in Asia</div>
        <div class="subtitle">138 curated roles vetted for timezone compatibility</div>
        <div class="badge">Find your next role</div>
    </div>
</body>
</html>
